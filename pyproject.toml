[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lc-clap-framework"
version = "0.1.0"
description = "LC-CLAP conditioned audio-text contrastive learning framework"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchaudio>=2.2",
]

[tool.setuptools]
packages = ["src"]
