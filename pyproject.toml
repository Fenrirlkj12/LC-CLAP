[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lc-clap-method-pattern"
version = "0.1.0"
description = "A public LC-CLAP method-pattern reference implementation"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchaudio>=2.2",
]

[tool.setuptools]
packages = ["src"]
